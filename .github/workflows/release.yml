name: Build Releases

env:
  UPSTREAM_REPOSITORY: Tahiya31/MultiSOCIAL_toolbox
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      run_windows_complete_e2e:
        description: Run the secret-backed Windows Complete diarization smoke test.
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'Tahiya31/MultiSOCIAL_toolbox') }}
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      should_publish_release: ${{ steps.meta.outputs.should_publish_release }}
    steps:
      - uses: actions/checkout@v6

      - name: Derive and validate release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(python -c "import re; from pathlib import Path; print(re.search(r'^version\\s*=\\s*\"([^\"]+)\"', Path('pyproject.toml').read_text(), re.M).group(1))")"
          release_tag="v${app_version}"
          should_publish="false"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_REPOSITORY}" == "${UPSTREAM_REPOSITORY}" ]]; then
            should_publish="true"
            if gh release view "${release_tag}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
              echo "Release or tag ${release_tag} already exists. Bump pyproject.toml before merging to main." >&2
              exit 1
            fi
          fi
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "should_publish_release=${should_publish}" >> "${GITHUB_OUTPUT}"

  python-tests:
    needs: prepare
    runs-on: macos-latest
    env:
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools==80.10.2"
          python -m pip install ".[dev]"
      - name: Run full Python test suite
        run: python -m pytest

  macos-build:
    needs: [prepare, python-tests]
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, complete]
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      MULTISOCIAL_BUILD_PROFILE: ${{ matrix.profile }}
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install macOS build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools==80.10.2"
          if [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]]; then
            python -m pip install ".[complete,dev]"
          else
            python -m pip install ".[dev]"
          fi

      - name: Build unchanged in-process macOS application
        env:
          MPLCONFIGDIR: ${{ github.workspace }}/.tmp/macos-mpl-${{ matrix.profile }}
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.tmp/macos-pyi-${{ matrix.profile }}
        run: pyinstaller --clean --noconfirm MultiSOCIAL.spec

      - name: Validate and smoke-test macOS application
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          app_path="dist/${app_name}.app"
          link="${app_path}/Contents/Frameworks/Python.framework/Versions/Current"
          test -d "${app_path}"
          test -L "${link}"
          expected="${APP_VERSION}"
          actual="$(plutil -extract CFBundleShortVersionString raw "${app_path}/Contents/Info.plist")"
          test "${actual}" = "${expected}"
          MULTISOCIAL_IMPORT_SMOKE_TEST=1 MULTISOCIAL_VERIFY_HEAVY_POSE_ASSET=1 \
            "${app_path}/Contents/MacOS/${app_name}"
          python .github/scripts/validate_complete_bundle_layout.py

      - name: Restore immutable macOS Whisper E2E cache
        if: ${{ github.repository != env.UPSTREAM_REPOSITORY && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@v4
        with:
          path: .tmp/macos-huggingface
          key: macos-${{ matrix.profile }}-whisper-tiny-169d4a4341b33bc18d8881c4b69c2e104e1cc0af-hub-v1

      - name: Run fork-tag packaged macOS native E2E
        if: ${{ github.repository != env.UPSTREAM_REPOSITORY && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        # Warm local source-mode runs finish in seconds; a cold run pays only the
        # pinned Whisper download. Fail fast instead of burning the 6h default.
        timeout-minutes: 30
        shell: bash
        env:
          HF_HOME: ${{ github.workspace }}/.tmp/macos-huggingface
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          HF_HUB_ETAG_TIMEOUT: "60"
          HF_HUB_DISABLE_TELEMETRY: "1"
          MULTISOCIAL_WHISPER_MODEL_ID: openai/whisper-tiny
          MULTISOCIAL_WHISPER_MODEL_REVISION: 169d4a4341b33bc18d8881c4b69c2e104e1cc0af
          MULTISOCIAL_MACOS_PACKAGED_E2E: "1"
          MULTISOCIAL_MACOS_E2E_WORKSPACE: ${{ github.workspace }}/.tmp/macos-e2e-${{ matrix.profile }}
          MULTISOCIAL_CI_HF_TOKEN: ${{ secrets.MULTISOCIAL_CI_HF_TOKEN }}
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          "dist/${app_name}.app/Contents/MacOS/${app_name}"

      - name: Archive macOS application
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          mkdir -p release-artifacts workflow-artifacts
          ditto -c -k --sequesterRsrc --keepParent "dist/${app_name}.app" \
            "release-artifacts/${app_name}-macos.zip"
          cp -R "dist/${app_name}.app" workflow-artifacts/
          cp "release-artifacts/${app_name}-macos.zip" workflow-artifacts/

      - uses: actions/upload-artifact@v5
        with:
          name: MultiSOCIAL-${{ env.APP_VERSION }}-${{ matrix.profile }}-${{ runner.os }}
          path: workflow-artifacts/*

  windows-build:
    needs: [prepare, python-tests]
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, complete]
        repetition: [1, 2, 3]
    runs-on: windows-2025
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      MULTISOCIAL_BUILD_PROFILE: ${{ matrix.profile }}
      # Keep the real packaged ASR E2E reproducible: cache one immutable model
      # snapshot, allow slow CDN connections, and keep telemetry out of CI logs.
      HF_HOME: ${{ github.workspace }}/.tmp/huggingface
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "60"
      HF_HUB_DISABLE_TELEMETRY: "1"
      MULTISOCIAL_WHISPER_MODEL_ID: openai/whisper-tiny
      MULTISOCIAL_WHISPER_MODEL_REVISION: 169d4a4341b33bc18d8881c4b69c2e104e1cc0af
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.tmp/pycache-${{ matrix.profile }}-${{ matrix.repetition }}
      YOLO_AUTOINSTALL: "false"
      YOLOv5_AUTOINSTALL: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Restore immutable Whisper E2E cache
        uses: actions/cache@v4
        with:
          path: .tmp/huggingface
          key: windows-${{ matrix.profile }}-whisper-tiny-169d4a4341b33bc18d8881c4b69c2e104e1cc0af-hub-0.24.7-v1

      - name: Verify committed Windows packaging inputs
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch \
            packaging/windows_gui.spec \
            packaging/windows_worker_launcher.c \
            packaging/build_windows_worker_launcher.py \
            packaging/build_windows_embedded_worker.py \
            .github/scripts/run_windows_packaged_request.py \
            .github/scripts/windows_packaged_e2e.py
          test -f packaging/windows_gui.spec
          test -f packaging/build_windows_embedded_worker.py

      - name: Create physically separate GUI and worker environments
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-gui
          python -m venv .venv-worker
          .venv-gui/Scripts/python.exe -m pip install --require-hashes --no-deps \
            -r requirements/locks/windows-gui-py310.txt
          .venv-worker/Scripts/python.exe -m pip install --require-hashes --no-deps \
            -r "requirements/locks/windows-${MULTISOCIAL_BUILD_PROFILE}-py310.txt"

      - name: Audit dependency ownership before analysis
        shell: bash
        run: |
          set -euo pipefail
          .venv-gui/Scripts/python.exe packaging/audit_windows_environment.py \
            --kind gui --lock requirements/locks/windows-gui-py310.txt
          .venv-worker/Scripts/python.exe packaging/audit_windows_environment.py \
            --kind worker --lock "requirements/locks/windows-${MULTISOCIAL_BUILD_PROFILE}-py310.txt"

      - name: Build static native worker launcher
        shell: bash
        run: |
          set -euo pipefail
          python packaging/build_windows_worker_launcher.py \
            --output ".tmp/worker-launcher-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}/MultiSOCIAL-Worker-Launcher.exe"

      - name: Build native-free Windows GUI
        shell: bash
        env:
          MPLCONFIGDIR: ${{ github.workspace }}/.tmp/gui-mpl-${{ matrix.repetition }}
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.tmp/gui-pyi-${{ matrix.repetition }}
        run: |
          set -euo pipefail
          .venv-gui/Scripts/python.exe -m PyInstaller --clean --noconfirm \
            --workpath ".tmp/gui-work-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}" \
            --distpath ".tmp/gui-dist-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}" \
            packaging/windows_gui.spec

      - name: Build private embedded Windows worker runtime
        shell: bash
        env:
          MPLCONFIGDIR: ${{ github.workspace }}/.tmp/worker-mpl-${{ matrix.repetition }}
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.tmp/worker-pyi-${{ matrix.repetition }}
        run: |
          set -euo pipefail
          .venv-worker/Scripts/python.exe packaging/build_windows_embedded_worker.py \
            --python .venv-worker/Scripts/python.exe \
            --output ".tmp/worker-dist-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}/worker"
          .venv-worker/Scripts/python.exe packaging/audit_windows_environment.py \
            --kind worker --lock "requirements/locks/windows-${MULTISOCIAL_BUILD_PROFILE}-py310.txt"

      - name: Assemble opaque worker runtime under GUI runtime
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          python packaging/assemble_windows.py \
            --gui ".tmp/gui-dist-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}/${app_name}" \
            --worker ".tmp/worker-dist-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}/worker" \
            --launcher ".tmp/worker-launcher-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}/MultiSOCIAL-Worker-Launcher.exe" \
            --output "dist/${app_name}"
          python packaging/validate_windows_bundle.py --root "dist/${app_name}" \
            --profile "${MULTISOCIAL_BUILD_PROFILE}"
          python .github/scripts/validate_complete_bundle_layout.py

      - name: Diagnose direct native launcher-to-worker probe
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          workspace=".tmp/worker-diagnostic-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}"
          mkdir -p "${workspace}"
          printf '{"operation":"probe","payload":{"profile":"%s"}}\n' "${MULTISOCIAL_BUILD_PROFILE}" > "${workspace}/request.json"
          python .github/scripts/run_windows_packaged_request.py \
            --worker "dist/${app_name}/worker/MultiSOCIAL-Worker-Launcher.exe" \
            --request "${workspace}/request.json" \
            --result "${workspace}/result.json" \
            --timeout 60

      - name: Measure cold packaged GUI-to-worker MediaPipe startup
        if: matrix.profile == 'standard' && matrix.repetition == 1
        shell: bash
        run: |
          set -euo pipefail
          workspace=".tmp/gui-worker-cold-startup"
          mkdir -p "${workspace}"
          printf '{"operation":"probe","payload":{"profile":"standard"},"timeout_seconds":300}\n' > "${workspace}/request.json"
          python .github/scripts/run_windows_packaged_request.py \
            --gui "dist/MultiSOCIAL-Standard/MultiSOCIAL-Standard.exe" \
            --request "${workspace}/request.json" \
            --result "${workspace}/result.json" \
            --timeout 315 \
            --preserve-diagnostics

      - name: Diagnose packaged GUI-to-worker probe
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          workspace=".tmp/gui-worker-diagnostic-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}"
          mkdir -p "${workspace}"
          printf '{"operation":"probe","payload":{"profile":"%s"},"timeout_seconds":60}\n' "${MULTISOCIAL_BUILD_PROFILE}" > "${workspace}/request.json"
          python .github/scripts/run_windows_packaged_request.py \
            --gui "dist/${app_name}/${app_name}.exe" \
            --request "${workspace}/request.json" \
            --result "${workspace}/result.json" \
            --timeout 75

      - name: Exercise packaged GUI-to-worker native operations
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          options=()
          [[ "${{ matrix.repetition }}" == "1" ]] && options+=(--include-whisper)
          python .github/scripts/windows_packaged_e2e.py \
            --gui "dist/${app_name}/${app_name}.exe" \
            --profile "${MULTISOCIAL_BUILD_PROFILE}" \
            --workspace ".tmp/e2e-${MULTISOCIAL_BUILD_PROFILE}-${{ matrix.repetition }}" \
            --whisper-attempts 3 \
            "${options[@]}"

      - name: Run optional Complete diarization E2E
        if: matrix.repetition == 1 && matrix.profile == 'complete' && (needs.prepare.outputs.should_publish_release == 'true' || inputs.run_windows_complete_e2e)
        shell: bash
        env:
          MULTISOCIAL_CI_HF_TOKEN: ${{ secrets.MULTISOCIAL_CI_HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MULTISOCIAL_CI_HF_TOKEN}"
          export MULTISOCIAL_WORKER_HF_TOKEN="${MULTISOCIAL_CI_HF_TOKEN}"
          python .github/scripts/windows_packaged_e2e.py \
            --gui dist/MultiSOCIAL-Complete/MultiSOCIAL-Complete.exe \
            --profile complete \
            --workspace .tmp/e2e-complete-1 \
            --only-diarization

      - name: Archive canonical Windows build
        if: matrix.repetition == 1
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          mkdir -p release-artifacts
          python -c "import shutil; shutil.make_archive('release-artifacts/${app_name}-windows','zip',root_dir='dist',base_dir='${app_name}')"

      - name: Upload canonical Windows workflow artifact
        if: matrix.repetition == 1
        uses: actions/upload-artifact@v5
        with:
          name: MultiSOCIAL-${{ env.APP_VERSION }}-${{ matrix.profile }}-${{ runner.os }}
          path: release-artifacts/*-windows.zip

  windows-client-compat:
    needs: [prepare, windows-build]
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, complete]
    runs-on: windows-2022
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      MULTISOCIAL_BUILD_PROFILE: ${{ matrix.profile }}
      HF_HOME: ${{ github.workspace }}/.tmp/huggingface
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "60"
      HF_HUB_DISABLE_TELEMETRY: "1"
      MULTISOCIAL_WHISPER_MODEL_ID: openai/whisper-tiny
      MULTISOCIAL_WHISPER_MODEL_REVISION: 169d4a4341b33bc18d8881c4b69c2e104e1cc0af
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Restore immutable Whisper E2E cache
        uses: actions/cache@v4
        with:
          path: .tmp/huggingface
          key: windows-${{ matrix.profile }}-whisper-tiny-169d4a4341b33bc18d8881c4b69c2e104e1cc0af-hub-0.24.7-v1
      - uses: actions/download-artifact@v5
        with:
          name: MultiSOCIAL-${{ env.APP_VERSION }}-${{ matrix.profile }}-Windows
          path: .tmp/download

      - name: Relocate bundle to an installation-like path
        shell: pwsh
        run: |
          $installRoot = Join-Path $PWD ".tmp\Installed Apps\Üser Validation"
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          $archive = Get-ChildItem ".tmp\download" -Filter "*-windows.zip" | Select-Object -First 1
          if (-not $archive) { throw "Downloaded Windows ZIP is missing" }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $installRoot
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Diagnose relocated native launcher-to-worker probe
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          worker="$(find "${INSTALL_ROOT}" -path "*/worker/MultiSOCIAL-Worker-Launcher.exe" -type f -print -quit)"
          test -n "${worker}"
          workspace=".tmp/compat-worker-diagnostic-${MULTISOCIAL_BUILD_PROFILE}"
          mkdir -p "${workspace}"
          printf '{"operation":"probe","payload":{"profile":"%s"}}\n' "${MULTISOCIAL_BUILD_PROFILE}" > "${workspace}/request.json"
          python .github/scripts/run_windows_packaged_request.py \
            --worker "${worker}" \
            --request "${workspace}/request.json" \
            --result "${workspace}/result.json" \
            --timeout 60

      - name: Diagnose relocated packaged GUI-to-worker probe
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          gui="$(find "${INSTALL_ROOT}" -name "${app_name}.exe" -type f -print -quit)"
          test -n "${gui}"
          workspace=".tmp/compat-gui-worker-diagnostic-${MULTISOCIAL_BUILD_PROFILE}"
          mkdir -p "${workspace}"
          printf '{"operation":"probe","payload":{"profile":"%s"},"timeout_seconds":60}\n' "${MULTISOCIAL_BUILD_PROFILE}" > "${workspace}/request.json"
          python .github/scripts/run_windows_packaged_request.py \
            --gui "${gui}" \
            --request "${workspace}/request.json" \
            --result "${workspace}/result.json" \
            --timeout 75

      - name: Run extracted canonical ZIP through packaged boundary
        shell: bash
        run: |
          set -euo pipefail
          app_name="MultiSOCIAL-Standard"
          [[ "${MULTISOCIAL_BUILD_PROFILE}" == "complete" ]] && app_name="MultiSOCIAL-Complete"
          gui="$(find "${INSTALL_ROOT}" -name "${app_name}.exe" -type f -print -quit)"
          test -n "${gui}"
          python .github/scripts/windows_packaged_e2e.py \
            --gui "${gui}" \
            --profile "${MULTISOCIAL_BUILD_PROFILE}" \
            --workspace ".tmp/compat-${MULTISOCIAL_BUILD_PROFILE}" \
            --include-whisper \
            --whisper-attempts 3

      - name: Run qualified Complete diarization after relocation
        if: matrix.profile == 'complete' && (needs.prepare.outputs.should_publish_release == 'true' || inputs.run_windows_complete_e2e)
        shell: bash
        env:
          MULTISOCIAL_CI_HF_TOKEN: ${{ secrets.MULTISOCIAL_CI_HF_TOKEN }}
          MULTISOCIAL_WHISPER_MODEL_ID: openai/whisper-tiny
        run: |
          set -euo pipefail
          test -n "${MULTISOCIAL_CI_HF_TOKEN}"
          gui="$(find "${INSTALL_ROOT}" -name MultiSOCIAL-Complete.exe -type f -print -quit)"
          export MULTISOCIAL_WORKER_HF_TOKEN="${MULTISOCIAL_CI_HF_TOKEN}"
          python .github/scripts/windows_packaged_e2e.py \
            --gui "${gui}" \
            --profile complete \
            --workspace .tmp/compat-complete \
            --only-diarization

  publish:
    if: needs.prepare.outputs.should_publish_release == 'true'
    needs: [prepare, macos-build, windows-build, windows-client-compat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: MultiSOCIAL-${{ needs.prepare.outputs.app_version }}-*
          path: qualified-artifacts
          merge-multiple: true
      - name: Create qualified release and upload four assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: qualified-artifacts/*.zip
